套齐了，Mercury/Wise/Relay 才肯开门。地址用代理虚拟地址会被拒或后期冻结。", "ev": "B", "src": "各银行开户政策（Mercury https://mercury.com ；Wise https://wise.com ；Relay https://relayfi.com）；美国 IRS SS-4 申请 EIN。", "url": "https://relayfi.com）；美国", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 6, "title": "转让定价与关联交易必须留文档", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=合规 影响=企业", "cost": "会计师/税务师年费数万起。", "plain": "境内外公司如果有买卖、服务费、授权，定价不能拍脑袋——要用「独立交易原则」留文档，否则被两国任意一方认定为转移利润。", "gain": "规范的转让定价文档在税务稽查时是护身符；没有文档被纠错时，补税+罚款没商量。", "ev": "A", "src": "OECD Transfer Pricing Guidelines for Multinational Enterprises (2022). https://www.oecd.org/tax/transfer-pricing/ ; 中国《特别纳税调整实施办法》。", "url": "https://www.oecd.org/tax/transfer-pricing/", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 7, "title": "非居民友好银行/EMI 对比", "tags": "钱=少 时间=少 毅力=些 收益=中 口径=账户 影响=企业", "cost": "多数月费 $0 起，但非银行 EMI 不保本。", "plain": "Mercury（需真实地址，禁部分国家）、Wise Business（最易开，但非银行大额及时提）、Airwallex（中资背景亚洲友好）、Payoneer（平台收款无需 LLC）。", "gain": "Stripe/PayPal 收款必须同国银行账户（美国 ACH），所以「先开 LLC + 美国账户」是收美金的标配。别同时向 5 家递申请（触发风控）。", "ev": "B", "src": "各平台官网费率页（Mercury/Wise/Airwallex/Payoneer/Brex）；美国 ACH 规则（NACHA）。 ｜官方：https://www.mercury.com/", "url": "https://www.mercury.com/", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 8, "title": "美国 LLC 注册要点（以怀俄明/特拉华为例）", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=架构 影响=企业", "cost": "州注册费 $50–$300 + 注册代理年费 $100 左右。", "plain": "选州看目的（怀俄明隐私/税优、特拉华融资友好、新墨西哥匿名）；注册代理 + Articles of Organization + EIN + 运营协议 + 真实经营地址 + 接 Stripe。", "gain": "LLC 是收美金、接平台、做业务的「标配壳」，但记住它也要报税、做经济实质，不是避税黑洞。", "ev": "B", "src": "美国各州 Secretary of State 注册页面；IRS Form SS-4（EIN）；Stripe 收单要求 https://stripe.com", "url": "https://stripe.com", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 9, "title": "中国 ODI 境外投资备案（发改委/商务部/外管局三部门）", "tags": "钱=少 时间=多 毅力=些 收益=高 口径=资金 影响=企业", "cost": "材料+中介数万人民币起；全流程约 3 个月。", "plain": "境内企业真去海外设公司/并购，境内要过三道关——发改委（敏感类核准、非敏感类备案）、商务部（发《企业境外投资证书》）、银行办外汇登记（外管局已下放银行）。地方企业中方投资额 ≥3 亿美元→国家发改委备案；<3 亿→省级发改委。核准/备案文件有效期 2 年。", "gain": "不办 ODI 直接汇出资金=非法逃汇，钱出不去也回不来；办了才能合法汇出、利润合法汇回、过审查。先备案再投钱，顺序不能反。", "ev": "A", "src": "国家发改委《企业境外投资管理办法》(11 号令) https://www.ndrc.gov.cn ；商务部《境外投资管理办法》(3 号令) http://www.mofcom.gov.cn ；外管局 https://www.safe.gov.cn", "url": "https://www.safe.gov.cn", "note": "〔争议〕国办发〔2017〕74号把房地产/酒店/影城/娱乐业/体育俱乐部、无实业项目的股权投资基金或投资平台列为限制类须核准；实务中「快设快出」「母小子大」会被重点审查。"}, {"ch": 2, "ch_title": "出海企业篇", "no": 10, "title": "37号文登记：自然人境外 SPV 与返程投资", "tags": "钱=少 时间=多 毅力=些 收益=高 口径=资金 影响=个人／企业", "cost": "第三方服务 0.8–2.5 万人民币（无官方收费）；周期 10–20 个工作日。", "plain": "中国籍自然人要境外设 SPV（特殊目的公司）做投融资、红筹上市、返程投资，必须向外管局登记（汇发〔2014〕37号，2025 修订为汇发〔2025〕7号）。设了 SPV 后 30 天内登记。不登记=资金出不去、回来也违规，罚款违法金额三成以下、情节严重三成以上并限制 1–3 年跨境投融资。", "gain": "这是自然人唯一的境外 SPV 合规通道；红筹上市、ESOP 行权、利润调回都靠它。别用「代持」绕开，代持被穿透照样罚。", "ev": "A", "src": "国家外汇管理局《关于境内居民通过特殊目的公司境外投融资及返程投资外汇管理有关问题的通知》(汇发〔2014〕37号) https://www.safe.gov.cn", "url": "https://www.safe.gov.cn", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 11, "title": "跨境电商合规三件套：平台规则 + VAT + 商标", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=合规 影响=企业", "cost": "VAT 注册/申报年费数千到数万；商标注册千级美元。", "plain": "做 Amazon/独立站，三件事不能省——①守平台规则（刷单/侵权会封号，封号=资产清零）；②欧盟/英/澳卖货要注册 VAT/OSS（远程销售阈值 1 万欧触发 OSS）；③商标提前注，否则被跟卖/抢注。", "gain": "合规三件套是跨境生意的「地基」；省了其中一个，迟早踩雷。", "ev": "B", "src": "Amazon Seller University https://sell.amazon.com ；欧盟 VAT/OSS https://taxation-customs.ec.europa.eu ；EUIPO https://www.euipo.europa.eu", "url": "https://www.euipo.europa.eu", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 12, "title": "海外商标布局：美国 / 欧盟 / 马德里", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=资产 影响=企业", "cost": "美国基础申请 $350/类（2025-01-18 起），信息不全/自由文本另加 $100–$200/类；欧盟/马德里另计。", "plain": "出海品牌先注商标再卖货。美国走 USPTO（$350/类，2025 新规合并 TEAS 为单一基础申请）；欧盟 EUIPO 一件覆盖 27 国；马德里体系(WIPO)一份申请多国指定。按目标市场选路径，别等被抢注才着急。", "gain": "商标是品牌资产+平台护城河；被抢注后赎回成本是注册费的几十倍。", "ev": "B", "src": "USPTO 2025 商标费 https://www.uspto.gov/trademarks/fees ；EUIPO https://www.euipo.europa.eu ；WIPO 马德里 https://www.wipo.int/madrid", "url": "https://www.wipo.int/madrid", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 13, "title": "海外专利：PCT 国际申请", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=资产 影响=企业", "cost": "PCT 国际阶段费约 CHF 1,653 + 检索/传送费；进入国家阶段另计（各国官费+代理）。", "plain": "有技术创新要海外保护，走 PCT（专利合作条约）——一份申请、30 个月内决定进哪些国家，比逐国申请省心省钱。中国是 PCT 成员国，国家知识产权局受理。", "gain": "延后「选国」决策、统一检索、降低早期成本；对技术型出海是必须的护城河。", "ev": "B", "src": "WIPO PCT 门户 https://www.wipo.int/pct ；中国国家知识产权局 CNIPA https://www.cnipa.gov.cn", "url": "https://www.cnipa.gov.cn", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 14, "title": "数据合规 GDPR（面向欧盟用户必做）", "tags": "钱=少 时间=多 毅力=些 收益=高 口径=合规 影响=企业", "cost": "合规改造（隐私政策、DPO、数据映射）数万到数百万；违规罚款上限极高。", "plain": "只要你的产品/网站服务欧盟用户、或处理欧盟居民数据，无论公司在哪，都受 GDPR 管（域外效力）。核心：合法基础、告知同意、数据主体权利、泄露 72 小时通报。违规罚款两档：严重→2000 万欧或全球营业额 4%（孰高）；较轻→1000 万欧或 2%。", "gain": "欧盟市场大门的「入场券」；不合规轻则被罚、重则被禁处理（业务停摆）。", "ev": "A", "src": "Regulation (EU) 2016/679 (GDPR) Art. 83；欧盟委员会数据保护 https://commission.europa.eu/law/law-topic/data-protection", "url": "https://commission.europa.eu/law/law-topic/data-protection", "note": "〔争议〕GDPR 与各国数据本地化（如中国 PIPL、美国州法）并存，跨境传输须走 SCC/adequacy，不能只盯欧盟。"}, {"ch": 2, "ch_title": "出海企业篇", "no": 15, "title": "EU AI Act 合规（AI 产品出海欧盟）", "tags": "钱=少 时间=多 毅力=些 收益=高 口径=合规 影响=企业", "cost": "高风险系统合规（文档/评估/CE）成本高；违规罚款极高。", "plain": "AI 产品（含大模型、聊天机器人、推荐/风控）进欧盟，受 Regulation (EU) 2024/1689 管，2024-08-01 生效、分阶段落地。四级风险：不可接受（禁止）、高风险（强制合规+CE）、有限（透明度标识）、最小（基本不管）。罚款：禁止类违规→3500 万欧或全球营业额 7%（孰高）；其他义务→1500 万欧或 3%；虚假信息→750 万欧或 1%。域外适用。", "gain": "欧盟是全球最严 AI 法，「布鲁塞尔效应」会外溢；提前合规=可进欧盟+背书全球。", "ev": "A", "src": "Regulation (EU) 2024/1689 (AI Act)；欧盟 AI Office https://transition-pathways.europa.eu/retail/legislation/european-artificial-intelligence-act-ai-act", "url": "https://transition-pathways.europa.eu/retail/legislation/european-artificial-intelligence-act-ai-act", "note": "〔争议〕高风险义务时间表因 Regulation (EU) 2026/1744 延后（Annex III 独立系统 2027-12-02、产品安全部件 2028-08-02），但禁止类与透明度义务已生效，不能躺平。"}, {"ch": 2, "ch_title": "出海企业篇", "no": 16, "title": "海外本地化履约：海外仓 vs 直邮", "tags": "钱=少 时间=少 毅力=0 收益=中 口径=履约 影响=企业", "cost": "海外仓前置库存+仓租（资金占用）；直邮单件运费高、时效慢。", "plain": "电商出海履约两条路——海外仓（提前备货到目标国，时效快、体验好、但压库存和现金）；直邮/一件代发（轻资产、但时效慢、退货难）。选哪条看单量：单量稳→海外仓降成本提体验；单量小→先直邮验证。", "gain": "履约体验直接决定复购；选错模式要么压死现金、要么流失客户。", "ev": "C", "src": "行业通用实践；各海外仓服务商（Amazon FBA、第三方仓）规则。 ｜官方：https://sell.amazon.com/fulfillment-by-amazon", "url": "https://sell.amazon.com/fulfillment-by-amazon", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 17, "title": "雇佣团队：本地雇员 vs EOR vs 外包（企业视角）", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=组织 影响=企业", "cost": "本地雇员社保+合规最高；EOR 月费约 $500–$1000/人；外包按项目。", "plain": "海外要不要自己雇人？三选一——①设实体自雇（成本高、合规全担，但团队可控）；②EOR 名义雇主（不注册公司也能合规雇，快但贵，见 17 章）；③外包/contractors（最灵活，但别把 contractor 当雇员用，会被认定为变相雇佣追税）。按「市场确定性」决定：试水用 EOR/外包，站稳了再设实体。", "gain": "用人节奏决定扩张节奏；过早设实体烧钱、过晚雇人错失市场。", "ev": "C", "src": "综合 EOR 平台（Deel/Remote/Papaya，见 17 章）与本地雇佣实践。 ｜官方：https://www.deel.com/", "url": "https://www.deel.com/", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 18, "title": "海外记账 / 审计与财报要求", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=财务 影响=企业", "cost": "代理记账月费数百到数千美元；审计年费数千到数万。", "plain": "境外公司不是开了就完事——要按时做账、报税、年审。香港要审计+年审、新加坡要财报+AGM、美国 LLC 虽「穿透」但部分州有年报费。账目不清=被稽查补税+罚款，也过不了融资尽调。", "gain": "干净的账本是融资、转让定价、退出时的「体检报告」；平时不做，关键时刻掉链子。", "ev": "C", "src": "各司法辖区公司条例（HK CR / ACRA Singapore / US state）；OECD 会计准则趋同。 ｜官方：https://www.acra.gov.sg/", "url": "https://www.acra.gov.sg/", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 19, "title": "海外纠纷解决：仲裁条款（ICC / SIAC）", "tags": "钱=少 时间=少 毅力=0 收益=高 口径=风控 影响=企业", "cost": "仲裁费按争议金额比例（ICC 管理费+仲裁员酬金），不便宜；但比跨国诉讼可控。", "plain": "跨境合同一定写争议解决条款——优先选仲裁（ICC 国际商会、SIAC 新加坡、HKIAC 香港），不选某国法院（执行难）。仲裁一裁终局、1958《纽约公约》160+ 国可强制执行，是出海合同的「保险」。", "gain": "没仲裁条款=纠纷只能去对方主场法院打，赢了也难执行；有仲裁=中立地+可执行。", "ev": "B", "src": "ICC Dispute Resolution https://iccwbo.org/dispute-resolution-services/arbitration/ ；SIAC https://siac.org.sg ；联合国《承认及执行外国仲裁裁决公约》(纽约公约)。", "url": "https://siac.org.sg", "note": ""}, {"ch": 2, "ch_title": "出海企业篇", "no": 20, "title": "反避税 CFC（受控外国公司）规则", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业／个人", "cost": "无（合规义务）；违规补税+利息。", "plain": "以为在 BVI/开曼设公司利润留境外就不交税？多数国家（含中国 。", "plain": "美国国防部依《2021 国防授权法》第 1260H 条每年更新「在美运营的中国军事公司」清单；2026-06-08 版扩至 188 家（较 1 月 134 家净增 54），新增阿里、百度、比亚迪、蔚来、宇树、药明康德、速腾聚创等。", "gain": "清单本身不直接制裁，但 2024 NDAA §805 规定——2026-06-30 起国防部禁止**直接**采购，2027-06-30 起禁止**间接（经第三方）**采购。它还是传导到实体清单/NS-CMIC 的「预备库」。", "ev": "A", "src": "U.S. DoD Section 1260H List (2026-06-08); NDAA 2024 §805 (Pub. L. 118-31). https://www.defense.gov/ ; 联邦公报 https://www.federalregister.gov/", "url": "https://www.federalregister.gov/", "note": "〔争议〕清单本身为信息性清单，直接法律后果来自 §805 采购禁令及向实体清单/NS-CMIC 的交叉列名；「涉军」认定标准宽泛（含「小巨人」「单项冠军」等普通产业荣誉），存在被泛化适用的争议，不应据此推断企业有实质违规。"}, {"ch": 5, "ch_title": "地缘政治篇", "no": 2, "title": "BIS 实体清单（Entity List）：买它的货你也危险", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业", "cost": "无。", "plain": "美国商务部工业与安全局（BIS）实体清单上有 700+ 中国实体；向清单上企业出口/再出口美系元器件需许可（通常推定拒绝），且**进口方不知情不是好辩护**（reason to know）。", "gain": "每次向清单企业下单前都要查 BIS，否则你可能从「买家」变成「违规方」。清单随时更新、即时生效。", "ev": "A", "src": "U.S. Department of Commerce, BIS Entity List. https://www.bis.gov/entities ; EAR 第 744 条。", "url": "https://www.bis.gov/entities", "note": ""}, {"ch": 5, "ch_title": "地缘政治篇", "no": 3, "title": "OFAC SDN 清单：最严，交易广泛禁止", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业／个人", "cost": "无。", "plain": "财政部外国资产控制办公室（OFAC）的 SDN 清单是最严级别——与被列名者交易属民事+刑事违规，连「美国人」持有的证券都可能被冻结。", "gain": "跨境收付款前过一遍 OFN 筛查（银行也会自动筛），避免账户被冻、合作方暴雷牵连自己。", "ev": "A", "src": "U.S. Department of the Treasury, OFAC SDN List. https://ofac.treasury.gov/", "url": "https://ofac.treasury.gov/", "note": ""}, {"ch": 5, "ch_title": "地缘政治篇", "no": 4, "title": "CFIUS / 对外投资审查（COINS）：美资投敏感领域受限", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=企业", "cost": "无。", "plain": "美国外国投资委员会（CFIUS）审查涉美交易的国家安全影响；财政部「对外投资审查」（COINS）限制美资投向中国半导体/AI/量子/生物等敏感领域。", "gain": "涉及对美投资、并购、或接受美资的，提前做 CFIUS/COINS 评估，别等交割前夜被叫停。", "ev": "A", "src": "CFIUS (https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius); EO 14105 (2023) 对外投资审查。", "url": "https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius);", "note": ""}, {"ch": 5, "ch_title": "地缘政治篇", "no": 5, "title": "出口管制 EAR：最小含量 + 外国直接产品规则", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=企业", "cost": "无。", "plain": "即便不是美国货，只要含有一定「美系最小含量」或属于「外国直接产品（FDP）」范畴，也可能受 EAR 管辖——意味着非美供应链也可能被长臂管到。", "gain": "高集中度行业（半导体/通信/无人机/电池电车/生物/激光）做第三国架构时必须算清 FDP 规则，否则「绕道」无效。", "ev": "A", "src": "EAR §734.4 (de minimis) / §734.9 (FDP rules). https://www.bis.gov/export-controls", "url": "https://www.bis.gov/export-controls", "note": ""}, {"ch": 5, "ch_title": "地缘政治篇", "no": 6, "title": "行业风险分级：从「极高」到「中低」", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=企业", "cost": "无。", "plain": "半导体/先进计算、无人机/安防（大疆等）风险极高；电池/电车、AI/量子、生物/基因组高；普通消费/纺织/食品则中低——但仍要做供应商筛查。", "gain": "先给自己行业定级，再决定要不要「第三国实体」架构、关键元器件备货、CFIUS 评估。", "ev": "C", "src": "综合 BIS/DoD/OFAC 公开行业指引（见 5.1–5.5）。 ｜官方：https://www.bis.doc.gov/", "url": "https://www.bis.doc.gov/", "note": ""}, {"ch": 5, "ch_title": "地缘政治篇", "no": 7, "title": "数据合规与「长臂管辖」三套叠加", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=合规 影响=企业", "cost": "数据分类+合规改造，中小团队数万起。", "plain": "欧盟 GDPR、美国 CLOUD Act（云法案）、中国数据出境安全评估三套规则叠加；用户数据/源代码/算法出海前要做数据分类与出境合规。", "gain": "把国内一套系统直接搬海外不改数据合规，罚款可致死——尤其涉及欧盟公民数据。", "ev": "B", "src": "EU GDPR (Regulation 2016/679); U.S. CLOUD Act (2018); 中国《数据出境安全评估办法》. https://gdpr-info.eu/", "url": "https://gdpr-info.eu/", "note": ""}, {"ch": 5, "ch_title": "地缘政治篇", "no": 8, "title": "供应商筛查 SOP（每次采购前必做）", "tags": "钱=0 时间=少 毅力=些 收益=高 口径=风险 影响=企业", "cost": "免费筛查工具 + 流程纪律。", "plain": "把「查 BIS / OFAC / 1260H 三张表」做成每次下单前的强制 SOP，并查母公司/子公司 50% 持股穿透。", "gain": "一次漏查可能让整批货被扣、账户被冻、被列入下游客户的黑名单；SOP 是把「人为疏忽」变成「系统强制」。", "ev": "C", "src": "BIS/OFAC 筛查工具（bis.doc.gov、ofac.treasury.gov）+ 企业合规最佳实践。 ｜官方：https://ofac.treasury.gov/", "url": "https://ofac.treasury.gov/", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 1, "title": "Hall 高低语境文化模型", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=认知 影响=自己", "cost": "无。", "plain": "高语境（中/日/阿拉伯/拉美）意思在「关系+潜台词」里，重面子、间接；低语境（美德北欧/以色列）意思在「话里」，直接、就事论事。", "gain": "跟高语境市场别一上来谈条款，先建关系；跟低语境市场别绕弯子，直接给方案。「对味」能省一半沟通成本。", "ev": "B", "src": "Hall, E. T. (1976). Beyond Culture. Anchor Books. （跨文化传播经典理论） ｜官方：https://www.hofstede-insights.com/", "url": "https://www.hofstede-insights.com/", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 2, "title": "Hofstede 六维度：决策前先查目标国", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=认知 影响=自己", "cost": "无。", "plain": "权力距离（大=服从上级：中/阿/拉美大，北欧/德小）、个人主义vs集体主义、不确定性规避（日/法高、美/中低）、长期导向（中/新/韩高）。", "gain": "用维度预判对方管理风格与谈判偏好，避免拿自己文化当默认。Hofstede Insights 可查每个国家的分数。", "ev": "B", "src": "Hofstede, G. et al. (2010). Cultures and Organizations: Software of the Mind. https://hi.hofstede-insights.com/national-culture", "url": "https://hi.hofstede-insights.com/national-culture", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 3, "title": "商务礼仪速查（称呼/时间/谈判/送礼）", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=礼仪 影响=自己", "cost": "无。", "plain": "日本鞠躬+双手递名片+极准时间；德国直呼其名+职衔+数据驱动；美国名+握手+结果导向；阿拉伯热情+咖啡礼仪+关系信任；拉美拥抱贴面+关系至上。", "gain": "一套得体礼仪 = 隐性信任存款，尤其在中东/拉美/日本，失礼比报价高更致命。", "ev": "C", "src": "综合各国商务礼仪惯例（见 Hofstede Insights / 各国使馆商务指南）。 ｜官方：https://www.hofstede-insights.com/", "url": "https://www.hofstede-insights.com/", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 4, "title": "跨文化高频坑", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=自己", "cost": "无。", "plain": "对低语境「委婉拒绝」=真拒绝；对高语境「当场答应」=客气未必落实；在德国「这主意不错」可能是真赞，在亚洲可能是「我听到了」。", "gain": "重要约定留书面记录（邮件/会议纪要），尤其在关系强、契约弱的市场，白纸黑字才是保险。", "ev": "C", "src": "跨文化管理普遍经验（Hall/Hofstede 框架推论）。 ｜官方：https://www.hofstede-insights.com/", "url": "https://www.hofstede-insights.com/", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 5, "title": "别把国内「酒桌文化」搬出去", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=礼仪 影响=自己", "cost": "无。", "plain": "欧美合规环境下，靠饭局/酒精搞定客户反而可能触发合规调查（反贿赂法 FCPA/UKBA），且对女性伙伴尤其不妥。", "gain": "用专业方案 + 可量化结果建立信任，比饭局可持续，也不踩反贿赂红线。", "ev": "C", "src": "U.S. FCPA / UK Bribery Act 合规要求。 ｜官方：https://www.justice.gov/criminal-fraud/foreign-corrupt-practices-act", "url": "https://www.justice.gov/criminal-fraud/foreign-corrupt-practices-act", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 6, "title": "时间观：单时制(Monochronic) vs 多时制(Polychronic)", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=认知 影响=自己", "cost": "无。", "plain": "德国/北欧/美/日是单时制（时间线性、守时、一次一事、计划刚性）；拉美/中东/非洲/南欧是多时制（关系优先、时间弹性、同时多事、计划常变）。", "gain": "跟多时制市场别把日程排太满、别因对方迟到改期误读为不尊重；跟单时制市场务必守时、按议程走。", "ev": "B", "src": "Hall, E. T. (1983). The Dance of Life: The Other Dimension of Time.（时间人类学经典） ｜官方：https://www.hofstede-insights.com/", "url": "https://www.hofstede-insights.com/", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 7, "title": "直接与间接沟通：低语境批评 vs 高语境保面子", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=沟通 影响=自己", "cost": "无。", "plain": "低语境（美德以荷）开会直接说「这不行」；高语境（东亚/阿拉伯）当面多说「可以考虑」，真拒绝藏在沉默或「再研究」里，公开否定等于给对方面子难堪。", "gain": "对高语境伙伴，批评要私下、委婉、给台阶；对低语境伙伴，别用客气话包装真实异议，会被当成已同意。", "ev": "C", "src": "Hall 高低语境框架推论（见 6.1）。 ｜官方：https://www.hofstede-insights.com/", "url": "https://www.hofstede-insights.com/", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 8, "title": "送礼与「面子」：何时送、送什么、避讳什么", "tags": "钱=少 时间=少 毅力=0 收益=中 口径=礼仪 影响=自己", "cost": "伴手礼预算（几十到几百）。", "plain": "东亚/中东重面子与回礼；避讳：钟/伞（送终/散）、绿帽、白色黑色（丧）、4（死音）、13；伊斯兰国家避酒精与猪肉制品；日本礼尚往来极讲究包装与双手递。", "gain": "一份合宜伴手礼是信任存款；送错礼（如给穆斯林送酒、给东亚送钟）比不送更糟。", "ev": "C", "src": "跨文化礼仪通识（各国使馆商务指南）。 ｜官方：https://www.hofstede-insights.com/", "url": "https://www.hofstede-insights.com/", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 9, "title": "权力距离与决策方式（自上而下 vs 共识）", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=管理 影响=企业", "cost": "无。", "plain": "权力距离大的市场（中/阿/拉美/俄）决策集中在老板、层级分明；权力距离小的（北欧/德/以）授权到一线、开会要共识。", "gain": "在大权力距离市场，找不对决策人等于白谈；在小权力距离市场，越级或独断会被视为不专业。用 Hofstede PDI 预判。", "ev": "B", "src": "Hofstede Insights 权力距离维度. https://hi.hofstede-insights.com/national-culture", "url": "https://hi.hofstede-insights.com/national-culture", "note": ""}, {"ch": 6, "ch_title": "文化篇", "no": 10, "title": "个体主义 vs 集体主义对团队协作的影响", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=管理 影响=企业", "cost": "无。", "plain": "个人主义（美/英/荷/澳）重个人成就与合同，绩效看个人；集体主义（中/韩/日/拉美）重团队与关系，决策看圈内人、保全面子。", "gain": "带跨文化团队时，对集体主义成员多用团队荣誉与关系，对个人主义成员多用个人激励与清晰 KPI，别一套打法用遍全球。", "ev": 间=少 毅力=0 收益=中 口径=钱 影响=企业", "cost": "平台月费 + 全额工资 + 当地社保（常占工资 10%–30%）。", "plain": "EOR 不是「免费雇人」，你仍付全额工资和当地强制社保，只是把合规外包。算总账通常低于设实体的固定成本。", "gain": "预算时把社保算进去，避免低估。", "ev": "C", "src": "各 EOR 官网定价页 + 当地社保费率常识。 ｜官方：https://www.deel.com/", "url": "https://www.deel.com/", "note": ""}, {"ch": 17, "ch_title": "雇佣·EOR 平台与解雇成本（深化）", "no": 3, "title": "解雇成本：东南亚低、欧洲高", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业", "cost": "无（动作），但错误解雇的赔偿可达数月甚至数十月薪。", "plain": "印尼/越南解雇赔偿约 1 个月/年资；法国、西班牙、葡萄牙等欧洲国家无固定期限合同解雇极难，赔偿可高达数十月薪且有行政/司法程序。雇佣前先估「退出成本」。", "gain": "在劳动保护法强的国家，多用试用期/固定期限合同降低锁定。", "ev": "B", "src": "OECD 就业保护法指数 Employment Protection Legislation https://www.oecd.org/employment/ ；各国劳动法。", "url": "https://www.oecd.org/employment/", "note": ""}, {"ch": 17, "ch_title": "雇佣·EOR 平台与解雇成本（深化）", "no": 4, "title": "本地化配额：部分国家要求本地员工比例", "tags": "钱=0 时间=少 毅力=些 收益=中 口径=合规 影响=企业", "cost": "需招聘/保留一定比例的本地员工。", "plain": "沙特、印尼、马来西亚、部分非洲国家要求外来企业雇一定比例的本地人，甚至高管也要本地化。纯外派团队可能不合规。", "gain": "进入前查清配额，避免被限业或罚款。", "ev": "C", "src": "各国投资/劳工法规；世界银行 Doing Business（历史版）+ 当地律所实务。 ｜官方：https://www.doingbusiness.org/", "url": "https://www.doingbusiness.org/", "note": ""}, {"ch": 17, "ch_title": "雇佣·EOR 平台与解雇成本（深化）", "no": 5, "title": "远程雇佣合同三要点", "tags": "钱=0 时间=少 毅力=些 收益=高 口径=合规 影响=企业／个人", "cost": "起草/审合同几小时。", "plain": "跨境雇人合同必须写清三件事——①管辖法律与争议地（出事在哪打官司）；②发薪货币与税代扣；③终止通知期与知识产权归属。含糊等于埋雷。", "gain": "先把这三行写死，日后少 90% 扯皮。", "ev": "C", "src": "跨境雇佣实务共识；EOR 合同模板要点。 ｜官方：https://www.deel.com/", "url": "https://www.deel.com/", "note": ""}, {"ch": 18, "ch_title": "地缘政治·制裁与出口管制清单速查（深化）", "no": 1, "title": "BIS 实体清单 Entity List：约 3625 家需出口许可", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=红线 影响=企业", "cost": "无（查询），但交易需申请出口许可且多被「推定拒绝」。", "plain": "美国商务部 BIS 的实体清单（15 CFR 744 补编4）列了约 3625 个外国实体，向其出口受控物项要许可，且多数申请被推定拒绝。2026 年持续扩充。", "gain": "出货/技术合作前先查名单，撞上就冻结交易+罚款。", "ev": "A", "src": "美国商务部工业与安全局 BIS Entity List https://www.bis.doc.gov/index.php/policy-guidance/lists-of-parties-of-concern/entity-list ；联邦公报 91 FR 54658 (2026)。", "url": "https://www.bis.doc.gov/index.php/policy-guidance/lists-of-parties-of-concern/entity-list", "note": ""}, {"ch": 18, "ch_title": "地缘政治·制裁与出口管制清单速查（深化）", "no": 2, "title": "OFAC SDN 清单：资产冻结+美国人禁止交易", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=红线 影响=企业／个人", "cost": "无（查询），但与之交易违反美国制裁。", "plain": "财政部 OFAC 的 SDN（特别指定国民）清单上的人/实体，美国人和美国金融体系内的交易全面禁止，资产可被冻结。即便你不是美国人，用美元清算也会触发。", "gain": "收款前查 SDN，避免钱进不来还惹官司。", "ev": "A", "src": "美国财政部 OFAC SDN List https://ofac.treasury.gov/specially-designated-nationals-and-blocked-persons-list-sdn-human-readable-lists 。", "url": "https://ofac.treasury.gov/specially-designated-nationals-and-blocked-persons-list-sdn-human-readable-lists", "note": ""}, {"ch": 18, "ch_title": "地缘政治·制裁与出口管制清单速查（深化）", "no": 3, "title": "MEU 军事终端用户清单", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=红线 影响=企业", "cost": "无（查询），相关出口需许可。", "plain": "BIS 另有「军事终端用户」清单，向清单上实体出口特定物项受限。与实体清单并行，做军工/航天/通信相关的要额外查。", "gain": "双清单交叉查，别只查一个。", "ev": "B", "src": "BIS 受关注方清单 https://www.bis.doc.gov/index.php/policy-guidance/lists-of-parties-of-concern 。", "url": "https://www.bis.doc.gov/index.php/policy-guidance/lists-of-parties-of-concern", "note": ""}, {"ch": 18, "ch_title": "地缘政治·制裁与出口管制清单速查（深化）", "no": 4, "title": "CFIUS 投资审查：敏感行业外资收购要申报", "tags": "钱=0 时间=少 毅力=些 收益=高 口径=合规 影响=企业", "cost": "并购/投资前做 CFIUS 申报，周期数月。", "plain": "美国 CFIUS 审查外国对美投资是否威胁国家安全，涉及科技、数据、基建、医疗等敏感行业。中资背景交易常被强制剥离或否决。", "gain": "想收购美国公司/技术，先评估 CFIUS，别钱都付了被否。", "ev": "B", "src": "美国财政部 CFIUS https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius 。", "url": "https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius", "note": ""}, {"ch": 18, "ch_title": "地缘政治·制裁与出口管制清单速查（深化）", "no": 5, "title": "EAR 双用途物项：技术/软件也受控", "tags": "钱=0 时间=少 毅力=些 收益=高 口径=合规 影响=企业", "cost": "出口受控技术需分类(ECCN)并可能申请许可。", "plain": "美国出口管制看物项用途——既能民用也能军用的「双用途」技术、软件、甚至开源代码的分发都可能受 EAR 约束。AI 模型权重、加密技术尤其敏感。", "gain": "技术出海前做 ECCN 分类，别以为「只是软件」就随便传。", "ev": "B", "src": itle": "求职·数字游民签证速查（深化）", "no": 4, "title": "印尼/巴厘岛：落地长居与远程办公友好度", "tags": "钱=少 时间=少 毅力=些 收益=中 口径=生活 影响=个人", "cost": "可用旅游签/落地续签或第二家园类签证，月生活成本极低。", "plain": "巴厘岛是数字游民重镇，月租+生活约 800–1500 元人民币级（清迈更便宜）；但印尼没有专门数字游民签证，长期要靠续签或投资/退休类签证，政策波动大。", "gain": "低成本试水期首选，但别把它当长期身份方案。", "ev": "C", "src": "印尼移民局 https://www.imigrasi.go.id ；数字游民社区实测。", "url": "https://www.imigrasi.go.id", "note": ""}, {"ch": 19, "ch_title": "求职·数字游民签证速查（深化）", "no": 5, "title": "迪拜虚拟工作签证 / 黄金签证", "tags": "钱=少 时间=少 毅力=些 收益=高 口径=身份 影响=个人", "cost": "虚拟工作签需证明远程收入（约 US$3,500/月）+ 保险；黄金签证看投资/人才。", "plain": "阿联酋推远程工作签证（1 年可续）和黄金签证（5–10 年），叠加 0 个人所得税、0 资本利得税，对高收入数字游民极具吸引力；缺点是生活成本高、需本地保险。", "gain": "想合法 0 个税，迪拜是少数的主流选项。", "ev": "B", "src": "阿联酋政府门户 https://u.ae ；迪拜旅游局远程工作签证页。", "url": "https://u.ae", "note": ""}, {"ch": 19, "ch_title": "求职·数字游民签证速查（深化）", "no": 6, "title": "数字游民税务陷阱：183 天与双重征税协定", "tags": "钱=0 时间=少 毅力=些 收益=高 口径=税 影响=个人", "cost": "无（认知），做错要补税。", "plain": "多数国家按「一年住满 183 天」认定税务居民，届时全球收入要在这交税。两国都主张时靠「税收协定加比规则」判归属。别以为拿旅游签就能永久避税。", "gain": "提前规划停留天数与协定，避免双重征税或被追溯。", "ev": "B", "src": "OECD 税收协定范本（加比规则）https://www.oecd.org/tax/treaties/ 。", "url": "https://www.oecd.org/tax/treaties/", "note": ""}, {"ch": 20, "ch_title": "留学·分国别路径与工签（深化）", "no": 1, "title": "美国 F1→OPT→H1B：高薪但不确定", "tags": "钱=多 时间=多 毅力=多 收益=高 口径=身份 影响=个人", "cost": "年均学费+生活费 US$4–7 万；H1B 抽签中签率约 20%–30%。", "plain": "美国留学质量高、OPT 实习 1–3 年，但转工作签 H1B 靠抽签，大量人卡在等待。薪资上限高但身份不确定。", "gain": "适合冲名校+高薪行业；把身份不确定性算进成本。", "ev": "B", "src": "美国公民及移民局 USCIS https://www.uscis.gov/working-in-the-united-states ；SEVP Study in the States https://studyinthestates.dhs.gov 。", "url": "https://studyinthestates.dhs.gov", "note": ""}, {"ch": 20, "ch_title": "留学·分国别路径与工签（深化）", "no": 2, "title": "英国 Student→Graduate→Skilled Worker", "tags": "钱=多 时间=多 毅力=多 收益=中 口径=身份 影响=个人", "cost": "年均 £2–4 万；Graduate 签证（PSW）本科/硕士 2 年、博士 3 年。", "plain": "英国毕业后给 2 年 PSW 找工签，再转 Skilled Worker（需雇主担保+年薪门槛）。路径清晰但靠雇主担保，门槛逐年上调。", "gain": "比美国确定性高，但依赖找到担保雇主。", "ev": "B", "src": "英国内政部学生签证 https://www.gov.uk/student-visa 。", "url": "https://www.gov.uk/student-visa", "note": ""}, {"ch": 20, "ch_title": "留学·分国别路径与工签（深化）", "no": 3, "title": "澳大利亚 500→485→189/190 技术移民", "tags": "钱=多 时间=多 毅力=多 收益=高 口径=身份 影响=个人", "cost": "年均 AU$3–5 万；技术移民看打分（年龄/学历/雅思/职业）。", "plain": "澳洲毕业后给 485 临时工签 2–4 年，走 189/190 技术移民打分，凑够分直接拿 PR，是英语国家里「留学转永居」最透明的之一。", "gain": "目标明确冲 PR 的首选；职业在清单上最关键。", "ev": "B", "src": "澳大利亚内政部 Home Affairs https://immi.homeaffairs.gov.au 。", "url": "https://immi.homeaffairs.gov.au", "note": ""}, {"ch": 20, "ch_title": "留学·分国别路径与工签（深化）", "no": 4, "title": "新西兰 留学→Post-study work→Residence", "tags": "钱=中 时间=多 毅力=多 收益=高 口径=身份 影响=个人", "cost": "年均 NZ$3–4 万；打分制技术移民。", "plain": "新西兰留学后给 Post-study work visa，再走技术移民 Residence 打分（6 分制 2023 起）。人口少、移民政策相对友好，但职业清单窄。", "gain": "想安静拿 PR，新西兰竞争小于澳/加。", "ev": "B", "src": "新西兰移民局 INZ https://www.immigration.govt.nz 。", "url": "https://www.immigration.govt.nz", "note": ""}, {"ch": 20, "ch_title": "留学·分国别路径与工签（深化）", "no": 5, "title": "中国香港 留学→IANG→续签", "tags": "钱=中 时间=中 毅力=中 收益=高 口径=身份 影响=个人", "cost": "年均 HK$15–25 万；IANG 毕业即给 2 年无条件逗留。", "plain": "香港读研毕业拿 IANG 签证 2 年，之后靠在港工作续签，通常满 7 年可换永居。离家近、无语言壁垒、税低，是内地生的热门跳板。", "gain": "成本低于欧美、身份路径短，适合「先拿身份再观望」。", "ev": "B", "src": "香港入境事务处 https://www.immd.gov.hk 。", "url": "https://www.immd.gov.hk", "note": ""}, {"ch": 20, "ch_title": "留学·分国别路径与工签（深化）", "no": 6, "title": "马来西亚 留学→第二家园/就业", "tags": "钱=少 时间=中 毅力=中 收益=中 口径=身份 影响=个人", "cost": "学费显著低于欧美（年均 RM 1–3 万级）；第二家园需定存。", "plain": "马来西亚留学成本低、英语授课多，但毕业后留居靠「第二家园」(MM2H，需定存) 或雇主担保，工签确定性弱于澳新。适合预算有限+东南亚发展。", "gain": "低成本英语留学跳板，长期身份需另谋。", "ev": "C", "src": "马来西亚教育全球 https://educationmalaysia.gov.my 。", "url": "https://educationmalaysia.gov.my", "note": ""}, {"ch": 20, "ch_title": "留学·分国别路径与工签（深化）", "no": 7, "title": "德国 免学费+18 个月找工作签证→永居", "tags": "钱=少 时间=多 毅力=多 收益=高 口径=身份 影响=个人", "cost": "公立大学免/低学费（仅杂费）；需德语或英语授课+保证金。", "plain": "德国公立大学几乎免学费，毕业后给 18 个月找工作签证，缴税/交社保满 5 年可申永居（蓝卡路径更快）。是「低成本+高确定性留居」的欧洲首选。", "gain": "预算紧又想拿欧盟永居，德国性价比最高。", "ev": "B", "src": "Make it in Germany https://www.make-it-in-germany.com ；DAAD 德国学术交流中心。", "url": "https://www.make-it-in-germany.com", "note": ""}, {"ch": 21, "ch_title": "创业·主体搭建与跨境收款（深化）", "no": 1, "title": "新加坡公司：ACRA 注册 + EP 自雇", "tags": "钱=少 时间=少 毅力=些 收益=高 口径=主体 影响=创业者", "cost": "注册约 S$1,000 内，自雇 EP 需证明薪资与业务。", "plain": "新加坡公司注册快（几天）、税率低、声誉好，自雇拿 Employment Pass 还能拿身份。是亚洲创业者最常见的第一主体。", "gain": "低税+好名声+可转身份，性价比很高。", "ev": "B", "src": "新加坡会计与企业管制局 ACRA https://www.acra.gov.sg ；人力部 MOM EP https://www.mom.gov.sg 。", "url": "https://www.mom.gov.sg", "note": ""}, {"ch": 21, "ch_title": "创业·主体搭建与跨境收款（深化）", "no": 2, "title": "美国 LLC / Delaware C-Corp：有限责任隔离", "tags": "钱=少 时间=少 毅力=些 收益=高 口径=主体 影响=创业者", "cost": "Delaware C-Corp 注册+特许经营税年费数百美元起。", "plain": "做美国市场/拿美元融资，常设 Delaware C-Corp（融资友好）或本州 LLC（税务简单）。核心作用是「有限责任」——公司债不连累个人房车。", "gain": "隔离个人资产，是融资与签约的前提。", "ev": "B", "src": "特拉华州州务卿公司处 https://corp.delaware.gov 。", "url": "https://corp.delaware.gov", "note": ""}, {"ch": 21, "ch_title": "创业·主体搭建与跨境收款（深化）", "no": 3, "title": "香港公司：CR 注册 + 离岸申报", "tags": "钱=少 时间=少 毅力=些 收益=高 口径=主体 影响=创业者", "cost": "注册约 HK$5,000 内，年审+审计有持续费用。", "plain": "香港公司注册快、银行体系成熟、无资本利得税，配合第16.1的离岸豁免可做到低税，是连接内地与海外的经典跳板。", "gain": "内地出身创业者最顺手的第一主体。", "ev": "B", "src": "香港公司注册处 https://www.cr.gov.hk ；税务局 https://www.ird.gov.hk 。", "url": "https://www.ird.gov.hk", "note": ""}, {"ch": 21, "ch_title": "创业·主体搭建与跨境收款（深化）", "no": 4, "title": "跨境收款：Payoneer / 万里汇 / Stripe 对比", "tags": "钱=少 时间=少 毅力=0 收益=高 口径=钱 影响=创业者", "cost": "Payoneer/万里汇有入账费与换汇点差；Stripe 收单约 2.9%+固定费。", "plain": "收海外款三件套——Payoneer（拿美元/欧元账户收平台款）、万里汇 WorldFirst（阿里系，换汇费率低）、Stripe（建站收信用卡，开发友好）。按「从哪收、收什么币」选。", "gain": "选对收款通道，每年省几个点换汇损耗。", "ev": "C", "src": "Payoneer https://www.payoneer.com ；万里汇 https://www.worldfirst.com ；Stripe https://stripe.com 。", "url": "https://stripe.com", "note": ""}, {"ch": 21, "ch_title": "创业·主体搭建与跨境收款（深化）", "no": 5, "title": "反洗钱 KYC：平台会要身份证明+业务证明", "tags": "钱=0 时间=少 毅力=些 收益=高 口径=合规 影响=创业者", "cost": "开户需护照、地址证明、业务说明，审核数天至数周。", "plain": "所有跨境收款/银行平台都受反洗钱监管，开户要 KYC（认识你的客户）：谁、在哪、做什么生意、钱从哪来。资料不齐会被冻账。", "gain": "资料一次备齐，别等钱到了被卡。", "ev": "C", "src": "FATF 反洗钱标准 https://www.fatf-gafi.org ；各平台 KYC 政策。", "url": "https://www.fatf-gafi.org", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 1, "title": "美国：敏感行业红灯、普通申请黄灯", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业／个人", "cost": "无（判断成本）。", "plain": "半导体/AI/无人机/生物等敏感行业，美国的 1260H+实体清单+CFIUS 三连击意味着「合作、融资、采购、签证」全面收紧；但普通留学、非敏感求职、旅游仍走得通，只是更慢更严。", "gain": "给行业先定级（见 5.6），敏感行业必须上「第三国实体」架构并过 CFIUS；普通人走正规签证即可，别被「全面脱钩」吓住，也别盲目乐观。", "ev": "C", "src": "综合 U.S. DoD Section 1260H (2026-06-08)、BIS Entity List、CFIUS 政策（第 5 章）的合成判断。 https://www.federalregister.gov/", "url": "https://www.federalregister.gov/", "note": "〔争议〕「对华全面脱钩」是夸大叙事；实际是「精准脱钩+长臂管辖」，行业差异极大，不能一概而论。"}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 2, "title": "阿联酋：企业/税务绿灯，合规须满足", "tags": "钱=少 时间=多 毅力=些 收益=高 口径=税务 影响=企业／个人", "cost": "公司注册与自由区年费（数千到数万美元）。", "plain": "个税 0%、企业税 9%（免税额 37.5 万 AED，合格自由区 QFZP 0%），是企业主与高收入者的税务绿灯；但须满足经济实质与自由区「合格收入」规则，否则优惠落空。", "gain": "做中东/非洲生意的总部首选；2026 起经济实质与 UBO 透明要求趋严，空壳不再免税。", "ev": "A", "src": "UAE Federal Tax Authority, Corporate Tax (Federal Decree-Law No. 47 of 2022). https://tax.gov.ae/", "url": "https://tax.gov.ae/", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 3, "title": "新加坡：企业绿灯、税务黄灯（CRS+CFC）", "tags": "钱=少 时间=多 毅力=些 收益=高 口径=税务 影响=企业", "cost": "公司注册与秘书年费（数千新元起）。", "plain": "17% 企业税+属地征税+友好营商，是企业出海东南亚总部首选（绿灯）；但 2024 起有 CFC 规则、是 CRS 参与国、个人税率 0–24%（YA2026 无退税），高净值须正视申报（黄灯）。", "gain": "用新加坡做控股/区域总部合规可融资；但别当「避税天堂」——透明互换时代无秘密。", "ev": "A", "src": "IRAS, Corporate Income Tax / YA2026. https://www.iras.gov.sg/", "url": "https://www.iras.gov.sg/", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 4, "title": "香港：企业绿灯、资金黄灯（CRS 互换）", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=税务 影响=企业／个人", "cost": "公司注册与年审（数千港币起）。", "plain": "利得税两级制 8.25%/16.5%+离岸豁免可能+资金自由，是收汇与控股性价比之选（绿灯）；但香港已加入 CRS，离岸申报须有真实业务与所在地证据，且金融合规趋严（黄灯）。", "gain": "轻量架构收汇首选；但离岸豁免要逐年主动申报、备妥证据，不能想当然。", "ev": "A", "src": "香港税务局 Inland Revenue Department. https://www.ird.gov.hk/eng/tax/ind.htm", "url": "https://www.ird.gov.hk/eng/tax/ind.htm", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 5, "title": "泰国：游民/生活绿灯、求职黄灯", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=签证 影响=个人", "cost": "DTV 签证费约 1 万人民币 + 50 万泰铢证明。", "plain": "DTV 5 年、生活成本低、对华友好，是数字游民与旅居的性价比绿灯；但属游民签，不能在泰受雇，正式求职需工作签（黄灯）。", "gain": "先用 DTV 低成本验证东南亚生活与远程收入，再决定是否 deeper。", "ev": "B", "src": "泰国移民局 / MFA DTV. https://www.thaiembassy.com/thailand-visa/destination-thailand-visa-dtv", "url": "https://www.thaiembassy.com/thailand-visa/destination-thailand-visa-dtv", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 6, "title": "马来西亚：生活/养老/游民绿灯", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=生活 影响=个人／家庭", "cost": "MM2H 存款（约 50–100 万马币分级）；DE Rantau 收入证明。", "plain": "生活成本低于新泰、对华友好、MM2H 退休签与 DE Rantau 游民签友好，是「低成本长居」绿灯；但个税 0–30%、就业市场小，求职型机会有限。", "gain": "预算有限又想长期海外生活/养老，马来是亚洲最友好选项之一。", "ev": "C", "src": "马来西亚旅游部 MM2H / MDEC DE Rantau 官方说明. https://www.mdec.my/", "url": "https://www.mdec.my/", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 7, "title": "葡萄牙/西班牙（欧盟）：居留黄灯、税务黄灯", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=身份 影响=个人／家庭", "cost": "D8 €3,680/月 或 D7 €920/月 被动收入 + 保险 + 住址。", "plain": "D7/D8 是欧盟居留跳板（申根通行），但曾经的 NHR 低税已收紧、替身 IFICI 仅限高技能；西/葡税务与官僚成本不低（黄灯）。适合想拿欧盟身份者，不适合纯避税。", "gain": "欧盟身份+生活质量，但别指望低税；规划以「身份价值」而非「税率」为核心。", "ev": "B", "src": "葡萄牙 AIMA / 西班牙移民局. https://vistamigrante.portugal.gov.pt", "url": "https://vistamigrante.portugal.gov.pt", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 8, "title": "德国/加拿大：留学求职黄灯（严格但公平）", "tags": "钱=多 时间=多 毅力=些 收益=高 口径=路径 影响=个人", "cost": "自保金/学费/语言（德自保金约 €11,904/年；加留学+生活费）。", "plain": "两国规则清晰、对人才友好、留下来路径明确（留学→工签→永居），但门槛高、语言/资金硬（黄灯）。适合「认真规划、愿投入」的人，不适合试水。", "gain": "高质量教育+稳定身份路径；一旦进去规则透明可预期，是「慢但稳」的绿灯型路径。", "ev": "C", "src": "德国《居留法》/ 加拿大 IRCC. https://www.canada.ca/en/immigration-refugees-citizenship.html", "url": "https://www.canada.ca/en/immigration-refugees-citizenship.html", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 9, "title": "澳大利亚/新西兰：留学黄灯、移民收紧", "tags": "钱=多 时间=多 毅力=些 收益=中 口径=路径 影响=个人", "cost": "学费+生活费（澳年学费常 2–4 万澳元起）。", "plain": "教育质量高、留学路径成熟，但移民配额近年收紧、偏远地区加分、职业清单导向明显（黄灯）。适合以留学为目标者，别把「留学=移民」当默认。", "gain": "英联邦学历+可能的技术移民；但政策波动大，须以最新职业清单为准。", "ev": "C", "src": "澳大利亚 Home Affairs / 新西兰 Immigration NZ. https://immi.homeaffairs.gov.au/", "url": "https://immi.homeaffairs.gov.au/", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 10, "title": "英国：求职黄灯（Skilled Worker）", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=签证 影响=个人", "cost": "工签担保 + 薪资门槛（2024 起一般 £38,700）。", "plain": "脱欧后走「技术工签」路线，有担保雇主+达标薪资即可，路径清晰但门槛提高（黄灯）；高潜人才与创新 visa 另有通道。", "gain": "全球金融/科技中心+英联邦跳板；但对普通人薪资门槛是硬约束。", "ev": "B", "src": "UK Visas and Immigration, GOV.UK. https://www.gov.uk/skilled-worker-visa", "url": "https://www.gov.uk/skilled-worker-visa", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 11, "title": "日本/韩国：商务绿灯、移民红灯", "tags": "钱=少 时间=多 毅力=些 收益=中 口径=商务 影响=企业／个人", "cost": "商务签/经营管理签注册（日经营管理签需 500 万日元资本金）。", "plain": "做生意、设公司、短期驻在友好（绿灯）；但长期移民/入籍极难、文化壁垒高、求职对外国人限制多（红灯）。适合企业出海驻点，不适合个人「移过去」。", "gain": "东亚文化相近+市场成熟；但把日本当「定居地」性价比低。", "ev": "C", "src": "日本出入国在留管理厅 / 韩国法务部. https://www.isa.go.jp/", "url": "https://www.isa.go.jp/", "note": ""}, {"ch": 22, "ch_title": "分国别出海红绿灯（速查）", "no": 12, "title": "印尼/越南：制造出海黄灯、游民黄灯", "tags": "钱=多 时间=多 毅力=些 收益=高 口径=产业 影响=企业", "cost": "本地设厂/合资成本；印尼 E33G 游民签收入证明。", "plain": "两国是「产能出海+消费出海」热土（人口红利、供应链转移），但本地含量（TKDN）、合资要求、官僚与合规成本高（黄灯）；游民签（印尼 E33G）新但尚不成熟。", "gain": "供应链与消费双红利；但必须本地合伙+合规落地，不能只做贸易壳。", "ev": "C", "src": "印尼投资部 BKPM / 越南计划投资部. https://www.bkpm.go.id/", "url": "https://www.bkpm.go.id/", "note": ""}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 1, "title": "半导体 / 先进制造：红灯", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业／个人", "cost": "无（判断成本）。", "plain": "美国 BIS 实体清单、1260H、CHIPS 法案、设备出口管制精准打击中国背景半导体全链条（设计/制造/设备/EDA）。赴美/盟友国做半导体投资、采购、合作，几乎必触审查。", "gain": "机会在「非美供应链」（本土、东南亚成熟制程），但敏感行业者个人/企业出海美欧=全面收紧，须上「第三国实体」架构并过 CFIUS。", "ev": "A", "src": "U.S. BIS Entity List https://www.bis.gov ；Section 1260H https://www.defense.gov/ ；CHIPS and Science Act.", "url": "https://www.defense.gov/", "note": "〔争议〕「全面脱钩」夸大，实际是「精准脱钩+长臂管辖」，行业与环节差异极大。"}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 2, "title": "AI / 大模型：橙灯", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业", "cost": "无（判断成本）。", "plain": "AI 是中美战略竞争核心。美国对先进算力/模型权重出口管制（先进 GPU 禁运）；欧盟 AI Act 史上最严。但应用层（SaaS/行业模型/出海产品）仍可做，前提是避开军事/监控敏感用途、满足数据合规（GDPR/AI Act）。", "gain": "机会大但合规重；应用层出海空间广，底层算力/前沿模型受掣肘。先定「做哪一层」再谈出海。", "ev": "A", "src": "U.S. BIS 先进计算管制 https://www.bis.gov ；EU AI Act (Regulation (EU) 2024/1689)；U.S. EO 14110 (AI)。", "url": "https://www.bis.gov", "note": "〔争议〕「AI 脱钩」程度随政府更替波动，须动态跟踪，不能一次判断定终身。"}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 3, "title": "跨境电商 / 独立站：黄灯", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=企业", "cost": "无（判断成本）。", "plain": "最成熟的出海赛道，平台（Amazon/TikTok Shop）、支付（Stripe/万里汇）、物流（海外仓）生态完整。风险在平台规则（封号）、VAT（税务）、商标（抢注）、合规（产品安全/CE）。", "gain": "门槛低、现金流快，是中小卖家最佳起点；但「细节坑多」，合规三件套（2.11）是生死线。", "ev": "C", "src": "Amazon Seller University https://sell.amazon.com ；欧盟 VAT/OSS https://taxation-customs.ec.europa.eu", "url": "https://taxation-customs.ec.europa.eu", "note": ""}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 4, "title": "游戏 / 文娱 / 短视频：黄灯", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=企业", "cost": "无（判断成本）。", "plain": "内容出海（游戏出海、短剧、TikTok）增长快，但面临内容审查（各国）、版号（国内发行）、数据本地化、未成年保护、平台算法风险。", "gain": "文化产品毛利高、破圈快；但合规与本地化要求高，爆款与下架往往一线之隔。", "ev": "C", "src": "各国内容监管框架；GDPR（用户数据）https://commission.europa.eu/law/law-topic/data-protection", "url": "https://commission.europa.eu/law/law-topic/data-protection", "note": ""}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 5, "title": "金融科技 / 支付：橙红灯", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业", "cost": "无（判断成本）。", "plain": "金融是强监管行业，跨境支付/借贷/crypto 需本地牌照（MSO/EMI/支付牌照），合规成本高、审查严。中国背景 fintech 在美欧尤敏感（CFIUS/OFAC）。", "gain": "高门槛高回报，先拿牌照再谈规模；无牌运营=刑事风险。", "ev": "B", "src": "各司法辖区金融监管（美 OCC/SEC、英 FCA、港 HKMA、新 MAS）；OFAC 制裁清单 https://ofac.treasury.gov", "url": "https://ofac.treasury.gov", "note": ""}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 6, "title": "生物医药 / 医疗器械：黄灯", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=企业", "cost": "无（判断成本）。", "plain": "技术壁垒高、认证周期长（FDA/CE/NMPA），但需求刚性、利润好。中国创新药/器械出海靠 License-out 与海外临床。", "gain": "慢但稳的赛道；认证是护城河，一旦拿证壁垒高。", "ev": "B", "src": "U.S. FDA https://www.fda.gov ；EU MDR；中国 NMPA https://www.nmpa.gov.cn", "url": "https://www.nmpa.gov.cn", "note": ""}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 7, "title": "新能源 / 储能 / 基建：绿但敏感", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=风险 影响=企业", "cost": "无（判断成本）。", "plain": "「一带一路」+ 全球能源转型，新能源/储能/基建是中企出海绿区（订单多、政策鼓励），但进入欧美需注意「国家安全」审查（关键基础设施、电池供应链）。", "gain": "机会大、政策友好；欧美方向带敏感黄边，避开关键基础设施审查即可大步走。", "ev": "C", "src": "各国投资政策；CFIUS 关键基础设施审查框架。 ｜官方：https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius", "url": "https://home.treasury.gov/policy-issues/international/the-committee-on-foreign-investment-in-the-united-states-cfius", "note": ""}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 8, "title": "传统制造 / 供应链转移：绿灯", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=企业", "cost": "无（判断成本）。", "plain": "劳动密集型与中端制造向东南亚（越南/印尼/马来/泰国）转移是确定性趋势，土地/人工/关税优惠明显，「中国+1」布局成熟。", "gain": "最稳的出海方向之一；关税与成本套利清晰，适合实业落地。", "ev": "C", "src": "东盟各国投资促进机构（越南 MPI、印尼 BKPM、马来 MIDA）。 ｜官方：https://www.mida.gov.my/", "url": "https://www.mida.gov.my/", "note": ""}, {"ch": 23, "ch_title": "分行业出海红绿灯（半导体 / AI / 电商 / 制造…）", "no": 9, "title": "教育 / 咨询 / SaaS / 工具：黄绿灯", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=风险 影响=个人／企业", "cost": "无（判断成本）。", "plain": "轻资产、低敏感、全球可远程交付，是普通人/小团队出海的最佳起点（软件、咨询、在线教育、工具类）。风险在数据与内容合规（GDPR/AI Act 若涉欧）。", "gain": "最容易上手，但做大要补合规；一个人也能跑通 PMF，是验证出海能力的最低成本试验田。", "ev": "C", "src": "通用实践；合规见 2.14（GDPR）/ 2.15（EU AI Act）。 ｜官方：https://gdpr.eu/", "url": "https://gdpr.eu/", "note": ""}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 1, "title": "国际医疗保险：旅居/留学/外派第一件事", "tags": "钱=少 时间=少 毅力=0 收益=高 口径=医疗 影响=个人", "cost": "年保费约 $500–$5,000（视年龄/地区/免赔），比一次美国急诊便宜得多。", "plain": "国内医保基本不覆盖境外，出境第一步是买一份覆盖目的地的国际医疗险，最好带直付（direct billing）。", "gain": "一次境外阑尾炎手术在美国可花 $15,000+；有保险直付，你只签字不掏钱。这是性价比最高的「下行保护」。", "ev": "B", "src": "Cigna Global 公开费率页 https://www.cignaglobal.com/ ；Allianz Care https://www.allianzcare.com/ ；SafetyWing https://safetywing.com/", "url": "https://safetywing.com/", "note": "〔争议〕「旅游险」≠「医疗险」：旅游险只保短期意外，长期旅居必须买年度国际医疗险。"}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 2, "title": "STEP 美国旅行登记（Smart Traveler Enrollment Program）", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=应急 影响=个人", "cost": "免费，5 分钟在线填表。", "plain": "去美国（含过境）前在 STEP 登记行程，遇自然灾害、动乱、撤离时美国使馆会主动联系你并推送警报。", "gain": "撤离/撤侨时，登记者是使馆优先联系和协助对象，没登记的可能收不到通知。", "ev": "A", "src": "美国国务院 STEP 官方登记页 https://step.state.gov/", "url": "https://step.state.gov/", "note": "非美国公民也可登记，对华人旅行者同样有效。"}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 3, "title": "中国领事保护 12308（全球 24h 热线）", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=应急 影响=个人", "cost": "免费；可下载「外交部 12308」APP 或拨 +86-10-12308 / +86-10-65612308。", "plain": "在海外遇绑架、车祸、证件丢失、被抓，第一时间联系中国驻当地使领馆或拨 12308，这是国家给你的兜底救援通道。", "gain": "比找当地律师/警察更懂如何保护中国公民；重大突发事件使领馆会启动领事保护与协助。", "ev": "A", "src": "中国领事服务网（12308）https://cs.mfa.gov.cn/", "url": "https://cs.mfa.gov.cn/", "note": ""}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 4, "title": "撤侨/应急撤离机制怎么触发", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=应急 影响=个人", "cost": "免费（政府包机/船只通常免费或事后结算）。", "plain": "战争、大规模骚乱、重大自然灾害时，外交部会视情况组织撤侨；前提是你已在使领馆登记（见 24.2/24.3）。", "gain": "2022 俄乌、2023 苏丹、2024 黎以冲突都有成规模撤侨；登记 + 关注使领馆通知 = 拿到撤离船票。", "ev": "B", "src": "中国领事服务网撤侨与安全提醒 https://cs.mfa.gov.cn/ ；美国 travel.state.gov 撤离警报 https://travel.state.gov/", "url": "https://travel.state.gov/", "note": "撤侨优先级通常：老弱妇孺、港澳台同胞、持护照中国公民；商业航班仍在飞时一般先建议自购机票。"}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 5, "title": "入境疫苗与健康要求（黄皮书/新冠疫苗）", "tags": "钱=少 时间=少 毅力=些 收益=中 口径=健康 影响=个人", "cost": "疫苗几十到几百元；部分国家要求黄热病「小黄本」（Yellow Card）。", "plain": "去非洲、南美部分国家，入境可能查黄热病疫苗证明；新冠疫苗要求各国已大幅放宽但仍有变动。", "gain": "没带「小黄本」可能被拒入境或强制隔离；出发前查目的地官方健康要求，别只看机票 agent 的说法。", "ev": "B", "src": "WHO 国际旅行卫生 https://www.who.int/health-topics/travel ；美国 CDC 旅行健康 https://wwwnc.cdc.gov/travel/", "url": "https://wwwnc.cdc.gov/travel/", "note": ""}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 6, "title": "海外就医：直付 vs 报销 与 语言壁垒", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=医疗 影响=个人", "cost": "无（操作层面）。", "plain": "有直付网络（PPO/direct billing）的保险，看病签字就走；没有就先垫付再回国报销，流程长且要病历翻译公证。", "gain": "选保险时优先看「目的地是否有直付医院网络」，否则一场病可能先垫几万再等半年。", "ev": "C", "src": "各国际医疗险直付网络说明（Cigna Global https://www.cignaglobal.com/ 、Allianz Care https://www.allianzcare.com/ ）", "url": "https://www.allianzcare.com/", "note": ""}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 7, "title": "高风险地区安全险（战乱/绑架/恐怖）", "tags": "钱=少 时间=少 毅力=0 收益=高 口径=风险 影响=个人", "cost": "特定区域险保费较高，按行程天数计。", "plain": "去也门、阿富汗、部分非洲/中东冲突区，普通医疗险通常不保；需单独买「战争/绑架/ evacuation」专项险。", "gain": "这类地区一旦出事，救援成本高达数十万美元；专项险的 evacuation 条款能救命。", "ev": "B", "src": "Global Rescue 旅行安全 https://www.globalrescue.com/ ；Crisis24 https://www.crisis24.com/", "url": "https://www.crisis24.com/", "note": "〔争议〕部分「战区险」对「主动前往已知冲突区」免责，买前看清除外条款。"}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 8, "title": "紧急医疗转运（Medevac）条款必须有", "tags": "钱=少 时间=少 毅力=0 收益=高 口径=医疗 影响=个人", "cost": "通常含在年度国际医疗险内，或单独约 $100–$300/年。", "plain": "在医疗条件差的国家重病，保险应能安排专机转运到最近的好医院；没有这条，你只能靠商业航班硬扛。", "gain": "一次跨洲医疗转运市价 $30,000–$200,000；有 Medevac 覆盖 = 真·保命条款。", "ev": "B", "src": "Global Rescue https://www.globalrescue.com/ ；Cigna Global 医疗转运 https://www.cignaglobal.com/", "url": "https://www.cignaglobal.com/", "note": "确认保单「转运目的地」是否包含中国，部分只转运到 nearest adequate facility。"}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 9, "title": "旅行意外险 vs 国际医疗险：别买错", "tags": "钱=0 时间=少 毅力=0 收益=中 口径=医疗 影响=个人", "cost": "无。", "plain": "旅行意外险保「意外身故/行李丢失/航班延误」，便宜但极短期；医疗险保「看病治病」，长期旅居必须后者。", "gain": "很多人只买几十块的旅行险就出门，结果生病住院一分不赔。按停留时长选对险种。", "ev": "C", "src": "SafetyWing（长期旅居险）https://safetywing.com/ ；Cigna Global https://www.cignaglobal.com/", "url": "https://www.cignaglobal.com/", "note": ""}, {"ch": 24, "ch_title": "保险·医疗·应急撤离", "no": 10, "title": "境外身故/遗体运回与遗嘱预案", "tags": "钱=少 时间=少 毅力=些 收益=中 口径=风险 影响=家庭", "cost": "遗体运回数万元；部分保险含「遗体运送」责任。", "plain": "极端情况下，境外身故的遗体运回、遗产继承都极复杂；提前写遗嘱、买含遗体运送的险，是对家人的兜底。", "gain": "没预案，家属要跨国跑公证、缴费、等数月；有保险+遗嘱 = 流程从数月缩到数周。", "ev": "C", "src": "中国领事服务网（公民救助/领事协助）https://cs.mfa.gov.cn/ ；Global Rescue https://www.globalrescue.com/", "url": "https://www.globalrescue.com/", "note": "〔争议〕不同国籍/税籍下遗嘱效力差异大，高净值者务必请跨境遗产律师。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 1, "title": "黄金签证/投资居留全景（2026）", "tags": "钱=多 时间=多 毅力=些 收益=高 口径=身份 影响=个人／家庭", "cost": "葡萄牙基金 €500,000；希腊房产 €250,000（部分区涨到 €800k）；阿联酋黄金签 AED 2,000,000 或人才；加勒比护照 $100k–$250k。", "plain": "「花钱买居留/护照」仍可行，但门槛与审查逐年抬高；西班牙、英国、爱尔兰投资移民已关停，葡萄牙也停了房产路线。", "gain": "一张欧盟永居或加勒比护照 = 免签欧美 + 税务筹划空间 + 子女教育跳板。", "ev": "B", "src": "葡萄牙 AIMA https://aima.gov.pt/ ；希腊外交部 https://www.mfa.gr/ ；阿联酋政府 https://u.ae/", "url": "https://u.ae/", "note": "〔争议〕黄金签证「买身份」≠「买入籍」，多数需住满年限才换护照；且可能被原国籍国征税穿透。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 2, "title": "葡萄牙黄金签证（基金路线，已停房产）", "tags": "钱=多 时间=多 毅力=些 收益=高 口径=身份 影响=个人", "cost": "合格基金投资 €500,000（或科研/文化捐赠更低），另加律师费与受理费。", "plain": "葡萄牙 2023 年起关停「买房换签证」，现主要走「风险基金」路线；5 年可转永居/入籍，免签全申根。", "gain": "欧盟护照跳板中性价比最高之一；但须真实持有基金满 5 年且满足居住（平均每年 7 天）。", "ev": "B", "src": "葡萄牙移民局 AIMA https://aima.gov.pt/", "url": "https://aima.gov.pt/", "note": "〔争议〕基金有锁定期与净值波动风险，不是「存款」。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 3, "title": "希腊黄金签证（房产 €250k 起）", "tags": "钱=多 时间=多 毅力=些 收益=中 口径=身份 影响=个人", "cost": "房产投资 €250,000（热门区已升至 €800,000），含交易税与律师费。", "plain": "欧洲门槛最低的购房居留之一，无居住要求即可续签，7 年可入籍（需希腊语）。", "gain": "低价拿到欧盟申根居留，适合「不想住但想要身份」的人；但房产流动性差、有持有税。", "ev": "B", "src": "希腊外交部 https://www.mfa.gr/", "url": "https://www.mfa.gr/", "note": "〔争议〕2024 起热门区域门槛翻倍，且「只拿居留不入籍」享受不到欧盟公民的全部权利。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 4, "title": "阿联酋黄金签证（talent / 投资，10 年）", "tags": "钱=多 时间=少 毅力=0 收益=高 口径=身份 影响=个人", "cost": "投资 AED 2,000,000（约 ¥400 万）于房产/存款，或凭高薪/专业人才直接获发。", "plain": "阿联酋给企业家、高收入、科技人才发 10 年可续黄金签，0 个税，是「税务身份 + 居留」一步到位。", "gain": "对高收入者，迪拜黄金签 = 合法 0 个税 + 长居 + 自由区做生意，性价比极高。", "ev": "B", "src": "阿联酋政府官网 https://u.ae/", "url": "https://u.ae/", "note": "〔争议〕阿联酋无个税但有 9% 企业税（37.5 万 AED 免额）与自由区合格收入规则，企业主别只看到 0 个税。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 5, "title": "加勒比投资入籍（CBI 护照）", "tags": "钱=多 时间=少 毅力=0 收益=高 口径=身份 影响=个人／家庭", "cost": "捐赠/房产约 $100,000–$250,000（多米尼克、圣卢西亚、圣基茨等）。", "plain": "加勒比小国直接卖护照（不是居留），免签欧盟/英国/中国港澳台，是「护照多元化」的快通道。", "gain": "一本加勒比护照 = 多一个出行与税务身份选项，适合已有大额资产需分散风险者。", "ev": "B", "src": "投资入籍综合信息（Henley & Partners）https://www.henleyglobal.com/ ；各国 CBI 官网", "url": "https://www.henleyglobal.com/", "note": "〔争议〕欧盟已对部分加勒比护照收紧免签（如取消免申根），且 FATCA/CRS 下「护照 ≠ 隐身」。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 6, "title": "美国 EB-5 投资移民（$800k/$1.05M）", "tags": "钱=多 时间=多 毅力=些 收益=高 口径=身份 影响=个人／家庭", "cost": "目标就业区 $800,000 或非 TEA $1,050,000，另加 admin/律师费。", "plain": "EB-5 是用钱换美国绿卡，创造 10 个就业即可；排期对中国出生申请人仍长，但乡村/高失业区有预留名额。", "gain": "子女可享美国公立教育+本地生待遇，是「教育+身份」组合拳。", "ev": "B", "src": "美国移民局 EB-5 页面 https://www.uscis.gov/eb-5", "url": "https://www.uscis.gov/eb-5", "note": "〔争议〕EB-5 区域中心项目曾暴雷（资金挪用），必须选有监管托管的项目。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 7, "title": "弃籍税/弃美籍（Expatriation Tax）", "tags": "钱=多 时间=多 毅力=些 收益=中 口径=税务 影响=个人", "cost": "高净值弃籍可能缴「退出税」（mark-to-market 视同出售）；2025 covered expatriate 门槛约 $206 万净资产/近年税单。", "plain": "放弃美国国籍/长期绿卡不是签个字就完——「covered expatriate（特定弃籍者）」要按市价清算全球资产缴 exit tax。", "gain": "提前规划可合法降低弃籍税；临时抱佛脚反而被锁定高额税单。", "ev": "A", "src": "美国 IRS 弃籍税官方页 https://www.irs.gov/individuals/international-taxpayers/expatriation-tax", "url": "https://www.irs.gov/individuals/international-taxpayers/expatriation-tax", "note": "〔争议〕是否「covered」看当年门槛（逐年调涨）与近 5 年税单，需律师精算。"}, {"ch": 25, "ch_title": "身份规划·护照·国籍", "no": 8, "title": "中国不承认双重国籍（红线）", "tags": "钱=0 时间=少 毅力=0 收益=高 口径=法律 影响=个人", "cost": "无（但认知错误代价极大）。", "plain": "《国籍法》第 3 条不承认双重国籍；自愿取得外国国籍即自动丧失中国 script>
<script>
var gradeColor={A:"#1a7f37",B:"#0969da",C:"#6e7781"};
var gradeName={A:"A 权威",B:"B 机构",C:"C 推论"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;"}[c];});}
function tagsArr(t){return (t||"").split(/\s+/).filter(Boolean);}
function card(e){
  var tags=tagsArr(e.tags).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("");
  var note=e.note?'<div class="f"><span class="k">备注</span><span class="v">'+esc(e.note)+'</span></div>':'';
  var link=e.url?' <a class="src" href="'+esc(e.url)+'" target="_blank" rel="noopener">↗ 来源</a>':'';
  return '<article class="card" style="border-left-color:'+gradeColor[e.ev]+'">'+
    '<div class="ch">第'+e.ch+'章 · '+esc(e.ch_title)+'</div>'+
    '<h3><span class="badge" style="background:'+gradeColor[e.ev]+'">'+gradeName[e.ev]+'</span> '+e.ch+'.'+e.no+' '+esc(e.title)+'</h3>'+
    '<div class="tags">'+tags+'</div>'+
    '<div class="f"><span class="k">成本</span><span class="v">'+esc(e.cost)+'</span></div>'+
    '<div class="f"><span class="k">说人话</span><span class="v">'+esc(e.plain)+'</span></div>'+
    '<div class="f"><span class="k">收益</span><span class="v">'+esc(e.gain)+'</span></div>'+
    '<div class="f"><span class="k">证据等级</span><span class="v">'+e.ev+'</span></div>'+
    '<div class="f"><span class="k">来源</span><span class="v">'+esc(e.src)+link+'</span></div>'+
    note+'</article>';
}
function filtered(){
  var q=document.getElementById("q").value.trim().toLowerCase();
  var ch=document.getElementById("ch").value;
  var gA=document.getElementById("gA").checked,gB=document.getElementById("gB").checked,gC=document.getElementById("gC").checked;
  var onlyc=document.getElementById("onlyc").checked;
  return DATA.filter(function(e){
    if(ch && String(e.ch)!==ch) return false;
    if(e.ev==="A"&&!gA) return false;
    if(e.ev==="B"&&!gB) return false;
    if(e.ev==="C"&&!gC) return false;
    if(onlyc && !/争议/.test(e.note||"")) return false;
    if(q){
      var hay=(e.title+" "+e.plain+" "+e.cost+" "+e.gain+" "+e.src+" "+e.tags+" "+e.note+" "+e.ch_title).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}
function draw(list){
  document.getElementById("count").textContent="匹配 "+list.length+" / "+DATA.length+" 条";
  document.getElementById("list").innerHTML=list.map(card).join("")||'<p class="empty">没有匹配条目</p>';
}
function apply(){draw(filtered());}
(function init(){
  var sel=document.getElementById("ch");
  META.chapters.forEach(function(c){var o=document.createElement("option");o.value=c.no;o.textContent=c.no+". "+c.title;sel.appendChild(o);});
  document.getElementById("q").addEventListener("input",apply);
  sel.addEventListener("change",apply);
  ["gA","gB","gC","onlyc"].forEach(function(id){document.getElementById(id).addEventListener("change",apply);});
  document.getElementById("rand").addEventListener("click",function(){var f=filtered();if(f.length){draw([f[Math.floor(Math.random()*f.length)]]);}});
  document.getElementById("reset").addEventListener("click",function(){
    document.getElementById("q").value="";sel.value="";
    gA.checked=gB.checked=gC.checked=true;onlyc.checked=false;apply();
  });
  apply();
})();
</script>
